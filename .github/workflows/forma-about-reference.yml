# Forma /about reference capture — measured evidence for the Roducq
# /about recreation (structure, computed CSS, animation timings,
# screenshots at the seven milestone widths in both colour schemes).
#
# WHY A SEPARATE WORKFLOW. The repository's development sandbox has an
# egress allowlist that blocks `forma-visuvate.framer.website`, so the
# reference cannot be measured in-process. A GitHub-hosted runner can
# reach it, so — following `forma-reference.yml` and the per-page
# `forma-*-reference.yml` workflows — this workflow runs the same capture
# harness against the reference AND against this repository's own /about
# page in one job, with the same browser build, viewports and themes.
#
# IT IS READ-ONLY WITH RESPECT TO THE REPOSITORY'S CODE. It never
# modifies a source file, never deploys, and never touches any payment,
# billing or database path. It publishes its output as a build artefact
# AND — because the development sandbox's egress allowlist blocks the
# artefact download host (`*.blob.core.windows.net`) — commits a
# curated subset of the evidence back onto the triggering session
# branch, which is fetchable over `github.com` (the same reason the
# older workflows force-pushed a capture branch, here constrained to
# the session branch only).
#
# TEMPORARY PUSH TRIGGER + PUBLISH STEP. GitHub will not dispatch a
# workflow that does not yet exist on the default branch, so during the
# audit this carries a narrowly-scoped `push` trigger on the audit
# session branch, limited to the two evidence files, plus a publish
# step that only runs for that push event. Both must be removed before
# the PR so the landed workflow is dispatch-only (the bootstrap
# discipline recorded in docs/FORMA_FINAL_FIDELITY_AUDIT.md §1.1).
name: forma-about-reference

on:
  workflow_dispatch:
    inputs:
      reference:
        description: "About page to measure"
        required: false
        default: "https://forma-visuvate.framer.website/about"
  push:
    branches:
      - arena/38893169-roducq
    paths:
      - "scripts/capture-about-reference.mjs"
      - ".github/workflows/forma-about-reference.yml"

permissions:
  # write is required only for the temporary session-branch evidence
  # publish step below; drop back to read with the trigger before the PR.
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.18.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start this repository's site
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/about -o /dev/null; then
              echo "about page is up"
              exit 0
            fi
            sleep 2
          done
          echo "site did not start" >&2
          exit 1

      - name: Capture this repository's /about page
        run: |
          node scripts/capture-about-reference.mjs \
            --target roducq \
            --base http://127.0.0.1:3000/about \
            --out docs/screenshots/forma-about-reference

      - name: Capture the reference /about page
        env:
          # `inputs` is only populated for workflow_dispatch; a
          # push-triggered run must fall back to the same default rather
          # than navigate to "".
          REFERENCE: ${{ inputs.reference || 'https://forma-visuvate.framer.website/about' }}
        run: |
          node scripts/capture-about-reference.mjs \
            --target forma \
            --base "$REFERENCE" \
            --out docs/screenshots/forma-about-reference

      - name: Report what was measured
        if: always()
        run: |
          find docs/screenshots/forma-about-reference -type f | sort | head -200
          du -sh docs/screenshots/forma-about-reference || true

      - name: Publish selected evidence to the session branch
        # Temporary bootstrap only (removed with the push trigger before
        # the PR): the sandbox cannot reach the artefact download host,
        # so a curated subset is committed to the triggering branch.
        # The commit touches only docs/screenshots/forma-about-reference,
        # which is outside the push `paths:` filter, so it cannot
        # retrigger this workflow.
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          # Curate: keep every JSON and every full-page PNG; keep
          # per-section PNGs only for the reference at 1440/390.
          find docs/screenshots/forma-about-reference -name "*-sec-*.png" \
            ! -name "forma-1440x900-*" ! -name "forma-390x844-*" -delete
          du -sh docs/screenshots/forma-about-reference || true
          git add -f docs/screenshots/forma-about-reference
          git commit -q -m "capture(about): measured Forma reference + current Roducq /about evidence [CI]" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forma-about-reference-capture
          path: docs/screenshots/forma-about-reference
          if-no-files-found: warn
          retention-days: 14
