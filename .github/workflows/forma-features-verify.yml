# Phase D verification for the recreated /features page —
# the PR #53 four-scenario LCP suite (three fresh runs each,
# PerformanceObserver-based) on BOTH /features and the home page
# regression control, the horizontal-overflow sweep at seven widths
# in both colour schemes, an axe-core pass on both routes, the
# reduced-motion entrance check and the no-JS miniature/visibility
# check.
#
# WHY A WORKFLOW. The development sandbox has no browser binary and
# its egress allowlist blocks the Playwright CDN, so real Chromium
# verification cannot run in-process here. A GitHub-hosted runner can
# install Chromium, so the suite runs there against the production
# build of this branch, exactly like the /solutions verification.
#
# IT IS READ-ONLY WITH RESPECT TO THE REPOSITORY'S CODE. It builds,
# serves and probes; it never modifies a source file, never deploys,
# and never touches any payment, billing or database path.
name: forma-features-verify

on:
  workflow_dispatch:
  # TEMPORARY — this trigger exists only so the suite can run from
  # this development branch before the workflow reaches the default
  # branch (GitHub will not dispatch a workflow that is not on the
  # default branch). It is removed before the pull request.
  push:
    branches:
      - arena/e0c5626f-roducq

permissions:
  # The report is published to the evidence branch, like the
  # reference capture before it.
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.18.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Build and serve the production site
        run: |
          npm run build
          npx next start -p 3100 -H 0.0.0.0 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3100/features >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3100/features >/dev/null || exit 1

      - name: Run the /features verification suite (with / regression)
        env:
          BASE_URL: http://localhost:3100
          OUTPUT: features-verification.json
        run: |
          node scripts/verify-features-lcp.mjs

      # The artifact endpoint is unreachable from some networks, so
      # the report is also committed to the evidence branch, where it
      # can be fetched with git.
      - name: Publish the verification report to the capture branch
        if: always()
        run: |
          git config user.name "Arena Agent"
          git config user.email "agent@arena.ai"
          git fetch --force origin arena/forma-features-capture
          # A real local branch (not a detached remote-tracking checkout)
          # so the push refspec resolves on the runner.
          git checkout -B arena/forma-features-capture origin/arena/forma-features-capture
          mkdir -p docs/screenshots/forma-features-reference
          cp features-verification.json docs/screenshots/forma-features-reference/features-verification.json
          git add -f docs/screenshots/forma-features-reference/features-verification.json
          git commit -q -m "verify: /features Phase D report $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no changes to commit"
          git push --force origin HEAD:arena/forma-features-capture

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forma-features-verification
          path: features-verification.json
          if-no-files-found: error
          retention-days: 14
